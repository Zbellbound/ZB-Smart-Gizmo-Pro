<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <style>
      .bg { fill: #f4f0e6; }
      .panel { fill: #fffdf8; stroke: #d8cfbe; stroke-width: 2; }
      .title { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 32px; font-weight: 700; fill: #1f1f1f; }
      .label { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 18px; fill: #5a554f; }
      .small { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 15px; fill: #6c655e; }
      .x { stroke: #e23b34; fill: #e23b34; }
      .y { stroke: #2c9a55; fill: #2c9a55; }
      .z { stroke: #2875d9; fill: #2875d9; }
      .white { stroke: white; fill: white; }
      .gold { stroke: #e8a72f; fill: #e8a72f; }
      .ink { stroke: #2b2b2b; fill: none; }
      .muted { stroke: #c7bca9; fill: none; }
      .dash { stroke-dasharray: 8 10; }
      .halo { fill: none; stroke: white; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .soft-fill { opacity: 0.18; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b3328" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e23b34"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2c9a55"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2875d9"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="720"/>
  <text class="title" x="64" y="58">ZB Smart Gizmo - Future Style Concepts</text>
  <text class="label" x="64" y="88">Three optional visual modes, not implementation. All keep red X, green Y, blue Z for orientation clarity.</text>

  <g transform="translate(55 125)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="530"/>
    <text class="title" x="32" y="54">1. ZB Minimal</text>
    <text class="label" x="32" y="82">Clean daily modeling style</text>
    <g transform="translate(215 270)">
      <ellipse class="halo" cx="0" cy="0" rx="106" ry="38" stroke-width="9"/>
      <ellipse class="line x" cx="0" cy="0" rx="106" ry="38" stroke-width="4" fill="none"/>
      <ellipse class="halo" cx="0" cy="0" rx="50" ry="106" stroke-width="9" transform="rotate(-25)"/>
      <ellipse class="line y" cx="0" cy="0" rx="50" ry="106" stroke-width="4" fill="none" transform="rotate(-25)"/>
      <ellipse class="halo" cx="0" cy="0" rx="86" ry="86" stroke-width="9"/>
      <circle class="line z" cx="0" cy="0" r="86" stroke-width="4" fill="none"/>
      <line class="halo" x1="0" y1="0" x2="128" y2="-70" stroke-width="10"/>
      <line class="line x" x1="0" y1="0" x2="128" y2="-70" stroke-width="5" marker-end="url(#arrow-red)"/>
      <line class="halo" x1="0" y1="0" x2="-118" y2="-64" stroke-width="10"/>
      <line class="line y" x1="0" y1="0" x2="-118" y2="-64" stroke-width="5" marker-end="url(#arrow-green)"/>
      <line class="halo" x1="0" y1="0" x2="0" y2="-145" stroke-width="10"/>
      <line class="line z" x1="0" y1="0" x2="0" y2="-145" stroke-width="5" marker-end="url(#arrow-blue)"/>
      <rect x="-18" y="-18" width="36" height="36" rx="8" fill="#2f5f73"/>
      <circle cx="0" cy="0" r="8" fill="#fffdf8"/>
      <path d="M-74 48 L-48 36 L-34 58 L-60 72 Z" fill="#2c9a55" opacity="0.28" stroke="#2c9a55" stroke-width="2"/>
      <path d="M46 44 L74 54 L56 78 L30 66 Z" fill="#e23b34" opacity="0.24" stroke="#e23b34" stroke-width="2"/>
    </g>
    <text class="small" x="32" y="445">Best for release/default:</text>
    <text class="small" x="32" y="472">small visual footprint, clear rings, low distraction.</text>
  </g>

  <g transform="translate(535 125)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="530"/>
    <text class="title" x="32" y="54">2. High Contrast</text>
    <text class="label" x="32" y="82">For complex scenes and training</text>
    <g transform="translate(215 270)">
      <circle cx="0" cy="0" r="120" fill="#efe6d2" opacity="0.45"/>
      <ellipse class="halo" cx="0" cy="0" rx="118" ry="45" stroke-width="16"/>
      <ellipse class="line x" cx="0" cy="0" rx="118" ry="45" stroke-width="8" fill="none"/>
      <ellipse class="halo" cx="0" cy="0" rx="55" ry="118" stroke-width="16" transform="rotate(-25)"/>
      <ellipse class="line y" cx="0" cy="0" rx="55" ry="118" stroke-width="8" fill="none" transform="rotate(-25)"/>
      <ellipse class="halo" cx="0" cy="0" rx="94" ry="94" stroke-width="16"/>
      <circle class="line z" cx="0" cy="0" r="94" stroke-width="8" fill="none"/>
      <line class="halo" x1="0" y1="0" x2="143" y2="-78" stroke-width="16"/>
      <line class="line x" x1="0" y1="0" x2="143" y2="-78" stroke-width="8" marker-end="url(#arrow-red)"/>
      <line class="halo" x1="0" y1="0" x2="-132" y2="-72" stroke-width="16"/>
      <line class="line y" x1="0" y1="0" x2="-132" y2="-72" stroke-width="8" marker-end="url(#arrow-green)"/>
      <line class="halo" x1="0" y1="0" x2="0" y2="-158" stroke-width="16"/>
      <line class="line z" x1="0" y1="0" x2="0" y2="-158" stroke-width="8" marker-end="url(#arrow-blue)"/>
      <rect x="-28" y="-28" width="56" height="56" rx="12" fill="#1f1f1f"/>
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="#e8a72f"/>
      <path d="M-86 50 L-42 30 L-24 62 L-68 84 Z" fill="#2c9a55" opacity="0.36" stroke="white" stroke-width="4"/>
      <path d="M38 38 L88 54 L62 92 L16 76 Z" fill="#e23b34" opacity="0.32" stroke="white" stroke-width="4"/>
    </g>
    <text class="small" x="32" y="445">Best for users who lose handles:</text>
    <text class="small" x="32" y="472">strong white backing, chunky rings, bigger hit targets.</text>
  </g>

  <g transform="translate(1015 125)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="530"/>
    <text class="title" x="32" y="54">3. Compact Pro</text>
    <text class="label" x="32" y="82">Dense architectural models</text>
    <g transform="translate(215 270)">
      <path class="halo" d="M-85 -20 A90 42 0 0 1 92 -16" stroke-width="9"/>
      <path class="line x" d="M-85 -20 A90 42 0 0 1 92 -16" stroke-width="4"/>
      <path class="halo" d="M-45 82 A52 98 -25 0 1 36 -96" stroke-width="9"/>
      <path class="line y" d="M-45 82 A52 98 -25 0 0 36 -96" stroke-width="4"/>
      <path class="halo" d="M-74 42 A86 86 0 1 1 58 62" stroke-width="9"/>
      <path class="line z" d="M-74 42 A86 86 0 1 1 58 62" stroke-width="4"/>
      <line class="halo" x1="0" y1="0" x2="104" y2="-56" stroke-width="9"/>
      <line class="line x" x1="0" y1="0" x2="104" y2="-56" stroke-width="4" marker-end="url(#arrow-red)"/>
      <line class="halo" x1="0" y1="0" x2="-94" y2="-50" stroke-width="9"/>
      <line class="line y" x1="0" y1="0" x2="-94" y2="-50" stroke-width="4" marker-end="url(#arrow-green)"/>
      <line class="halo" x1="0" y1="0" x2="0" y2="-120" stroke-width="9"/>
      <line class="line z" x1="0" y1="0" x2="0" y2="-120" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <circle cx="0" cy="0" r="16" fill="#fffdf8" stroke="#2f5f73" stroke-width="5"/>
      <circle cx="0" cy="0" r="5" fill="#2f5f73"/>
      <rect x="-70" y="38" width="26" height="26" rx="5" fill="#2c9a55" opacity="0.34" stroke="#2c9a55" stroke-width="2" transform="rotate(-20 -57 51)"/>
      <rect x="50" y="42" width="26" height="26" rx="5" fill="#e23b34" opacity="0.30" stroke="#e23b34" stroke-width="2" transform="rotate(18 63 55)"/>
      <path class="muted dash" d="M-110 112 L110 112" stroke-width="2"/>
    </g>
    <text class="small" x="32" y="445">Best as optional compact mode:</text>
    <text class="small" x="32" y="472">partial rings, shorter arrows, less screen clutter.</text>
  </g>
</svg>
