<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740">
  <defs>
    <style>
      .bg { fill: #f4f0e6; }
      .panel { fill: #fffdf8; stroke: #d8cfbe; stroke-width: 2; }
      .title { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 31px; font-weight: 700; fill: #1f1f1f; }
      .subtitle { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 18px; fill: #5a554f; }
      .note { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 15px; fill: #6c655e; }
      .tiny { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 13px; fill: #7c7368; }
      .x { stroke: #e23b34; fill: #e23b34; }
      .y { stroke: #2c9a55; fill: #2c9a55; }
      .z { stroke: #2875d9; fill: #2875d9; }
      .yellow { stroke: #f1bd39; fill: #f1bd39; }
      .white-stroke { stroke: white; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .axis { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .soft-x { fill: #e23b34; opacity: 0.22; stroke: #e23b34; }
      .soft-y { fill: #2c9a55; opacity: 0.22; stroke: #2c9a55; }
      .soft-z { fill: #2875d9; opacity: 0.18; stroke: #2875d9; }
      .ghost { fill: none; stroke: #c7bca9; stroke-width: 2; stroke-dasharray: 7 8; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b3328" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-red" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#e23b34"/>
    </marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2c9a55"/>
    </marker>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#2875d9"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="740"/>
  <text class="title" x="64" y="58">ZB Smart Gizmo - Known Style Options</text>
  <text class="subtitle" x="64" y="88">Not invented styles: option 1 is yours, option 2 follows Unity/Unreal separate widgets, option 3 follows common combined TransformControls.</text>

  <!-- 1: Original ZB -->
  <g transform="translate(55 130)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="540"/>
    <text class="title" x="32" y="54">1. ZB Original</text>
    <text class="subtitle" x="32" y="82">Current combined gizmo</text>
    <text class="tiny" x="32" y="108">Move arrows + rotate rings + scale grips together</text>
    <g transform="translate(215 284)">
      <ellipse class="white-stroke" cx="0" cy="0" rx="104" ry="38" stroke-width="10"/>
      <ellipse class="axis x" cx="0" cy="0" rx="104" ry="38" stroke-width="4"/>
      <ellipse class="white-stroke" cx="0" cy="0" rx="48" ry="104" stroke-width="10" transform="rotate(-24)"/>
      <ellipse class="axis y" cx="0" cy="0" rx="48" ry="104" stroke-width="4" transform="rotate(-24)"/>
      <circle class="white-stroke" cx="0" cy="0" r="84" stroke-width="10"/>
      <circle class="axis z" cx="0" cy="0" r="84" stroke-width="4"/>
      <line class="white-stroke" x1="0" y1="0" x2="126" y2="-70" stroke-width="10"/>
      <line class="axis x" x1="0" y1="0" x2="126" y2="-70" stroke-width="5" marker-end="url(#arrow-red)"/>
      <line class="white-stroke" x1="0" y1="0" x2="-116" y2="-64" stroke-width="10"/>
      <line class="axis y" x1="0" y1="0" x2="-116" y2="-64" stroke-width="5" marker-end="url(#arrow-green)"/>
      <line class="white-stroke" x1="0" y1="0" x2="0" y2="-142" stroke-width="10"/>
      <line class="axis z" x1="0" y1="0" x2="0" y2="-142" stroke-width="5" marker-end="url(#arrow-blue)"/>
      <circle cx="0" cy="0" r="20" fill="#fffdf8" stroke="#2f5f73" stroke-width="5"/>
      <circle cx="0" cy="0" r="6" fill="#2f5f73"/>
      <rect x="-72" y="42" width="32" height="32" rx="7" class="soft-y" stroke-width="2" transform="rotate(-20 -56 58)"/>
      <rect x="42" y="43" width="32" height="32" rx="7" class="soft-x" stroke-width="2" transform="rotate(18 58 59)"/>
    </g>
    <text class="note" x="32" y="462">Best for: your current product identity.</text>
    <text class="note" x="32" y="489">Low learning curve because everything is visible.</text>
  </g>

  <!-- 2: Unity/Unreal separate tool widgets -->
  <g transform="translate(535 130)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="540"/>
    <text class="title" x="32" y="54">2. Unity / Unreal Style</text>
    <text class="subtitle" x="32" y="82">Separate tool widget modes</text>
    <text class="tiny" x="32" y="108">Move, rotate, and scale are shown as separate modes</text>
    <g transform="translate(215 285)">
      <!-- Move widget -->
      <g transform="translate(-105 -8) scale(0.72)">
        <line class="white-stroke" x1="0" y1="0" x2="118" y2="-56" stroke-width="13"/>
        <line class="axis x" x1="0" y1="0" x2="118" y2="-56" stroke-width="7" marker-end="url(#arrow-red)"/>
        <line class="white-stroke" x1="0" y1="0" x2="-96" y2="-52" stroke-width="13"/>
        <line class="axis y" x1="0" y1="0" x2="-96" y2="-52" stroke-width="7" marker-end="url(#arrow-green)"/>
        <line class="white-stroke" x1="0" y1="0" x2="0" y2="-130" stroke-width="13"/>
        <line class="axis z" x1="0" y1="0" x2="0" y2="-130" stroke-width="7" marker-end="url(#arrow-blue)"/>
        <rect x="-48" y="-37" width="30" height="30" rx="4" class="soft-y" stroke-width="3" transform="rotate(-22 -33 -22)"/>
        <rect x="24" y="-34" width="30" height="30" rx="4" class="soft-x" stroke-width="3" transform="rotate(18 39 -19)"/>
        <circle cx="0" cy="0" r="12" fill="#fffdf8" stroke="#333" stroke-width="4"/>
      </g>
      <!-- Rotate widget -->
      <g transform="translate(105 -8) scale(0.72)">
        <circle class="white-stroke" cx="0" cy="0" r="108" stroke-width="12"/>
        <circle class="axis z" cx="0" cy="0" r="108" stroke-width="6"/>
        <ellipse class="white-stroke" cx="0" cy="0" rx="108" ry="38" stroke-width="12"/>
        <ellipse class="axis x" cx="0" cy="0" rx="108" ry="38" stroke-width="6"/>
        <ellipse class="white-stroke" cx="0" cy="0" rx="42" ry="108" stroke-width="12" transform="rotate(-24)"/>
        <ellipse class="axis y" cx="0" cy="0" rx="42" ry="108" stroke-width="6" transform="rotate(-24)"/>
        <circle class="axis yellow" cx="0" cy="0" r="122" stroke-width="4" fill="none"/>
        <circle cx="0" cy="0" r="10" fill="#fffdf8" stroke="#333" stroke-width="4"/>
      </g>
      <!-- Scale widget -->
      <g transform="translate(0 96) scale(0.62)">
        <line class="white-stroke" x1="0" y1="0" x2="118" y2="-56" stroke-width="13"/>
        <line class="axis x" x1="0" y1="0" x2="118" y2="-56" stroke-width="7"/>
        <rect x="112" y="-68" width="24" height="24" rx="3" class="x"/>
        <line class="white-stroke" x1="0" y1="0" x2="-96" y2="-52" stroke-width="13"/>
        <line class="axis y" x1="0" y1="0" x2="-96" y2="-52" stroke-width="7"/>
        <rect x="-118" y="-64" width="24" height="24" rx="3" class="y"/>
        <line class="white-stroke" x1="0" y1="0" x2="0" y2="-130" stroke-width="13"/>
        <line class="axis z" x1="0" y1="0" x2="0" y2="-130" stroke-width="7"/>
        <rect x="-12" y="-142" width="24" height="24" rx="3" class="z"/>
        <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#fffdf8" stroke="#333" stroke-width="4"/>
      </g>
    </g>
    <text class="note" x="32" y="462">Best for: users coming from game/editor tools.</text>
    <text class="note" x="32" y="489">Cleaner because one transform type can be shown at a time.</text>
  </g>

  <!-- 3: Combined transform controls -->
  <g transform="translate(1015 130)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="540"/>
    <text class="title" x="32" y="54">3. TransformControls Style</text>
    <text class="subtitle" x="32" y="82">Common web/DCC combined controls</text>
    <text class="tiny" x="32" y="108">Arrows, plane squares, scale cubes, rotation bands</text>
    <g transform="translate(215 285)">
      <circle class="ghost" cx="0" cy="0" r="124"/>
      <path class="white-stroke" d="M-88 86 A124 124 0 0 1 88 -86" stroke-width="10"/>
      <path class="axis z" d="M-88 86 A124 124 0 0 1 88 -86" stroke-width="5"/>
      <path class="white-stroke" d="M-120 -10 A124 50 0 0 1 120 -10" stroke-width="10"/>
      <path class="axis x" d="M-120 -10 A124 50 0 0 1 120 -10" stroke-width="5"/>
      <path class="white-stroke" d="M-48 116 A52 126 -25 0 0 1 46 -116" stroke-width="10"/>
      <path class="axis y" d="M-48 116 A52 126 -25 0 0 1 46 -116" stroke-width="5"/>

      <line class="white-stroke" x1="0" y1="0" x2="132" y2="-72" stroke-width="11"/>
      <line class="axis x" x1="0" y1="0" x2="132" y2="-72" stroke-width="5" marker-end="url(#arrow-red)"/>
      <rect x="86" y="-78" width="22" height="22" rx="3" class="x" transform="rotate(-28 97 -67)"/>
      <line class="white-stroke" x1="0" y1="0" x2="-122" y2="-66" stroke-width="11"/>
      <line class="axis y" x1="0" y1="0" x2="-122" y2="-66" stroke-width="5" marker-end="url(#arrow-green)"/>
      <rect x="-106" y="-75" width="22" height="22" rx="3" class="y" transform="rotate(28 -95 -64)"/>
      <line class="white-stroke" x1="0" y1="0" x2="0" y2="-150" stroke-width="11"/>
      <line class="axis z" x1="0" y1="0" x2="0" y2="-150" stroke-width="5" marker-end="url(#arrow-blue)"/>
      <rect x="-11" y="-114" width="22" height="22" rx="3" class="z"/>

      <rect x="-78" y="38" width="36" height="36" rx="5" class="soft-y" stroke-width="3" transform="rotate(-22 -60 56)"/>
      <rect x="42" y="38" width="36" height="36" rx="5" class="soft-x" stroke-width="3" transform="rotate(20 60 56)"/>
      <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#fffdf8" stroke="#333" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#333"/>
    </g>
    <text class="note" x="32" y="462">Best for: power users who want everything visible.</text>
    <text class="note" x="32" y="489">Closer to common TransformControls / DCC conventions.</text>
  </g>
</svg>
