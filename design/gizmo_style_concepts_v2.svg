<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <defs>
    <style>
      .bg { fill: #f4f0e6; }
      .panel { fill: #fffdf8; stroke: #d8cfbe; stroke-width: 2; }
      .title { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 31px; font-weight: 700; fill: #1f1f1f; }
      .label { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 18px; fill: #5a554f; }
      .small { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 15px; fill: #6c655e; }
      .x { stroke: #e23b34; fill: #e23b34; }
      .y { stroke: #2c9a55; fill: #2c9a55; }
      .z { stroke: #2875d9; fill: #2875d9; }
      .white { stroke: white; fill: white; }
      .gold { stroke: #e8a72f; fill: #e8a72f; }
      .ink { stroke: #2b2b2b; fill: none; }
      .muted { stroke: #c7bca9; fill: none; }
      .halo { fill: none; stroke: white; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 7 9; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b3328" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e23b34"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2c9a55"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2875d9"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="720"/>
  <text class="title" x="64" y="58">ZB Smart Gizmo - Three Distinct Future Looks</text>
  <text class="label" x="64" y="88">One keeps the current design, one uses half rotation arcs, one changes the language to brackets/corners.</text>

  <g transform="translate(55 125)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="530"/>
    <text class="title" x="32" y="54">1. Current Full Rings</text>
    <text class="label" x="32" y="82">The style we have now</text>
    <g transform="translate(215 270)">
      <ellipse class="halo" cx="0" cy="0" rx="104" ry="38" stroke-width="10"/>
      <ellipse class="line x" cx="0" cy="0" rx="104" ry="38" stroke-width="4" fill="none"/>
      <ellipse class="halo" cx="0" cy="0" rx="48" ry="104" stroke-width="10" transform="rotate(-24)"/>
      <ellipse class="line y" cx="0" cy="0" rx="48" ry="104" stroke-width="4" fill="none" transform="rotate(-24)"/>
      <circle class="halo" cx="0" cy="0" r="84" stroke-width="10"/>
      <circle class="line z" cx="0" cy="0" r="84" stroke-width="4" fill="none"/>
      <line class="halo" x1="0" y1="0" x2="128" y2="-70" stroke-width="10"/>
      <line class="line x" x1="0" y1="0" x2="128" y2="-70" stroke-width="5" marker-end="url(#arrow-red)"/>
      <line class="halo" x1="0" y1="0" x2="-118" y2="-64" stroke-width="10"/>
      <line class="line y" x1="0" y1="0" x2="-118" y2="-64" stroke-width="5" marker-end="url(#arrow-green)"/>
      <line class="halo" x1="0" y1="0" x2="0" y2="-142" stroke-width="10"/>
      <line class="line z" x1="0" y1="0" x2="0" y2="-142" stroke-width="5" marker-end="url(#arrow-blue)"/>
      <circle cx="0" cy="0" r="19" fill="#fffdf8" stroke="#2f5f73" stroke-width="5"/>
      <circle cx="0" cy="0" r="6" fill="#2f5f73"/>
      <rect x="-72" y="42" width="32" height="32" rx="7" fill="#2c9a55" opacity="0.25" stroke="#2c9a55" stroke-width="2" transform="rotate(-20 -56 58)"/>
      <rect x="42" y="43" width="32" height="32" rx="7" fill="#e23b34" opacity="0.23" stroke="#e23b34" stroke-width="2" transform="rotate(18 58 59)"/>
    </g>
    <text class="small" x="32" y="445">Purpose: familiar, balanced, easiest to learn.</text>
    <text class="small" x="32" y="472">Best default for first release.</text>
  </g>

  <g transform="translate(535 125)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="530"/>
    <text class="title" x="32" y="54">2. Half-Arc Rings</text>
    <text class="label" x="32" y="82">Open, directional rotation arcs</text>
    <g transform="translate(215 270)">
      <path class="halo" d="M-112 -20 C-78 -68 78 -68 112 -20" stroke-width="12"/>
      <path class="line x" d="M-112 -20 C-78 -68 78 -68 112 -20" stroke-width="5"/>
      <path class="halo" d="M-56 104 C-112 28 -62 -98 42 -114" stroke-width="12"/>
      <path class="line y" d="M-56 104 C-112 28 -62 -98 42 -114" stroke-width="5"/>
      <path class="halo" d="M-92 50 A105 105 0 0 1 92 50" stroke-width="12"/>
      <path class="line z" d="M-92 50 A105 105 0 0 1 92 50" stroke-width="5"/>
      <circle class="x" cx="-112" cy="-20" r="6"/>
      <circle class="x" cx="112" cy="-20" r="6"/>
      <circle class="y" cx="-56" cy="104" r="6"/>
      <circle class="y" cx="42" cy="-114" r="6"/>
      <circle class="z" cx="-92" cy="50" r="6"/>
      <circle class="z" cx="92" cy="50" r="6"/>
      <line class="halo" x1="0" y1="0" x2="128" y2="-70" stroke-width="10"/>
      <line class="line x" x1="0" y1="0" x2="128" y2="-70" stroke-width="5" marker-end="url(#arrow-red)"/>
      <line class="halo" x1="0" y1="0" x2="-118" y2="-64" stroke-width="10"/>
      <line class="line y" x1="0" y1="0" x2="-118" y2="-64" stroke-width="5" marker-end="url(#arrow-green)"/>
      <line class="halo" x1="0" y1="0" x2="0" y2="-142" stroke-width="10"/>
      <line class="line z" x1="0" y1="0" x2="0" y2="-142" stroke-width="5" marker-end="url(#arrow-blue)"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#fffdf8" stroke="#e8a72f" stroke-width="5"/>
      <circle cx="0" cy="0" r="6" fill="#e8a72f"/>
      <path class="muted dash" d="M-94 92 C-40 124 48 122 104 86" stroke-width="2"/>
    </g>
    <text class="small" x="32" y="445">Purpose: less clutter around the object.</text>
    <text class="small" x="32" y="472">Rotation reads as arcs, not full hoops.</text>
  </g>

  <g transform="translate(1015 125)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" rx="26" ry="26" width="430" height="530"/>
    <text class="title" x="32" y="54">3. Bracket Gizmo</text>
    <text class="label" x="32" y="82">Different language: corners and rails</text>
    <g transform="translate(215 270)">
      <path class="halo" d="M-110 -90 L-110 -128 L-72 -128" stroke-width="14"/>
      <path class="line y" d="M-110 -90 L-110 -128 L-72 -128" stroke-width="6"/>
      <path class="halo" d="M110 -90 L110 -128 L72 -128" stroke-width="14"/>
      <path class="line x" d="M110 -90 L110 -128 L72 -128" stroke-width="6"/>
      <path class="halo" d="M-110 92 L-110 130 L-72 130" stroke-width="14"/>
      <path class="line x" d="M-110 92 L-110 130 L-72 130" stroke-width="6"/>
      <path class="halo" d="M110 92 L110 130 L72 130" stroke-width="14"/>
      <path class="line y" d="M110 92 L110 130 L72 130" stroke-width="6"/>

      <path class="halo" d="M-122 0 A122 122 0 0 1 0 -122" stroke-width="10"/>
      <path class="line z" d="M-122 0 A122 122 0 0 1 0 -122" stroke-width="4"/>
      <path class="halo" d="M122 0 A122 122 0 0 1 0 122" stroke-width="10"/>
      <path class="line z" d="M122 0 A122 122 0 0 1 0 122" stroke-width="4"/>

      <line class="halo" x1="0" y1="0" x2="136" y2="-74" stroke-width="10"/>
      <line class="line x" x1="0" y1="0" x2="136" y2="-74" stroke-width="5" marker-end="url(#arrow-red)"/>
      <line class="halo" x1="0" y1="0" x2="-126" y2="-68" stroke-width="10"/>
      <line class="line y" x1="0" y1="0" x2="-126" y2="-68" stroke-width="5" marker-end="url(#arrow-green)"/>
      <line class="halo" x1="0" y1="0" x2="0" y2="-152" stroke-width="10"/>
      <line class="line z" x1="0" y1="0" x2="0" y2="-152" stroke-width="5" marker-end="url(#arrow-blue)"/>

      <rect x="-78" y="42" width="38" height="38" rx="4" fill="#e23b34" opacity="0.22" stroke="#e23b34" stroke-width="3"/>
      <rect x="38" y="42" width="38" height="38" rx="4" fill="#2c9a55" opacity="0.24" stroke="#2c9a55" stroke-width="3"/>
      <circle cx="0" cy="0" r="22" fill="#2f5f73"/>
      <path d="M-9 -9 L9 -9 L9 9 L-9 9 Z" fill="#fffdf8"/>
    </g>
    <text class="small" x="32" y="445">Purpose: visibly different product mode.</text>
    <text class="small" x="32" y="472">Corners suggest scale zones; arcs become secondary.</text>
  </g>
</svg>
